<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴日计划本</title><style>
:root{--p:#8874d9;--ink:#333344;--muted:#9493a3;--line:#eeeaf5;--bg1:#fffaf8;--bg2:#f8f7ff;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--bg1),var(--bg2));font:14px 'Microsoft YaHei',sans-serif;color:var(--ink)}button,input,select{font:inherit}button{transition:background .18s,color .18s,transform .18s,box-shadow .18s}.app{max-width:1400px;margin:auto;padding:22px;display:grid;grid-template-columns:290px 1fr;gap:19px}.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 9px 28px #544c7012}.side{height:max-content;position:sticky;top:10px}.brand{font-size:21px;font-weight:800}.brand i{font-style:normal;background:var(--p);color:#fff;border-radius:9px;padding:5px 7px}.muted{color:var(--muted);font-size:12px}.tabs,.views{display:flex;gap:4px;padding:4px;background:#f4f2f9;border-radius:13px;margin:15px 0}.tabs button,.views button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;color:#858394;font-size:12px}.tabs .on,.views .on{background:#fff;color:#705dc2;font-weight:bold;box-shadow:0 2px 7px #9c95b428}.nav{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin:15px 0 10px}.round{border:0;border-radius:50%;width:28px;height:28px;background:#f1eff7;color:#715ec2;font-size:18px}.week,.mini,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.week{font-size:11px;color:#aaa}.mini i,.mini span{height:30px;display:grid;place-items:center;font-size:12px;border-radius:9px;font-style:normal}.mini .today{background:var(--p);color:white}.mini .event{background:#fff0e9;color:#db7953}.quick{margin-top:18px;padding-top:13px;border-top:1px dashed #dfdbe8}.chip{border:0;background:#f0edff;color:#6754b8;border-radius:10px;padding:7px 9px;font-size:12px;margin:4px 3px 0 0;cursor:pointer}.head{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 15px}.head h1{margin:0;font-size:24px}.head p{margin:5px 0}.layout{display:grid;grid-template-columns:minmax(470px,1.55fr) minmax(290px,.82fr);gap:18px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calhead b{font-size:17px}.dow{font-size:11px;color:#aaa;padding:4px}.day{height:94px;border:1px solid transparent;background:#fbfaff;border-radius:14px;padding:6px;text-align:left;overflow:hidden}.day:hover{border-color:#d8d0fb}.empty{background:transparent}.day.today{background:var(--p);color:white}.term{font-size:10px;color:#b9b5c3;margin-left:4px}.today .term{color:#eee8ff}.lunar{font-size:10px;color:#e88562;height:12px}.today .lunar{color:#ffdbc9}.shift{display:inline-block;font-size:10px;padding:3px 4px;margin-top:4px;border-radius:5px;background:#dff2ff;color:#39769e}.day.overtime{background:#fff2eb}.overtime .shift{background:#ffe0d1;color:#ba6040}.day.normal{background:#effae9}.normal .shift{background:#dff1d7;color:#4d8744}.task{font-size:10px;border-left:3px solid #ffad8e;padding-left:5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{display:grid;gap:16px;height:max-content}.right h3{margin:0 0 11px;font-size:15px}.todo{display:block;margin:8px 0;font-size:13px}.todo input{accent-color:var(--p)}.add{display:flex;gap:5px;margin-top:9px}.add input{flex:1;min-width:0;border:1px solid #e8e4ed;border-radius:9px;padding:8px}.add button{border:0;border-radius:9px;background:var(--p);color:white;width:35px}.plans{display:grid;grid-template-columns:1fr 1fr;gap:7px}.plan{padding:9px;border-radius:12px;background:#fff0e9;font-size:12px}.plan+ .plan{background:#e9f8f2}.eventrow{padding:7px 0;border-bottom:1px solid #f1edf5;font-size:12px}.fortune{background:linear-gradient(135deg,#f9f0ff,#fff9e8)}.weather{background:linear-gradient(135deg,#effaff,#f6f0ff)}.fortune p,.weather p{font-size:12px;line-height:1.55}.future{grid-column:1/-1}.months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.month{border:1px solid #ede9f4;border-radius:12px;padding:9px;font-size:12px}.bar{height:5px;margin-top:8px;border-radius:5px;background:#ede9f6}.bar i{display:block;height:100%;background:var(--p);border-radius:5px}.modal{display:none;position:fixed;inset:0;background:#322d4f66;place-items:center;z-index:2}.modal.open{display:grid}.dialog{width:min(400px,92vw)}.dialog input,.dialog select{width:100%;border:1px solid #e7e3ed;border-radius:9px;padding:9px;margin:5px 0 9px}.save{border:0;border-radius:9px;padding:8px 12px;background:var(--p);color:#fff;float:right}.theme-dot{width:22px;height:22px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #ddd;margin:6px 7px 0 0;cursor:pointer}.theme-dot.on{box-shadow:0 0 0 2px var(--ink)}body[data-theme="coral"]{--p:#dc755e;--bg1:#fff2ee;--bg2:#fffaf4;--panel:#fffdfb}body[data-theme="mint"]{--p:#3e9f84;--bg1:#effcf8;--bg2:#eefaff;--panel:#fcfffe}body[data-theme="sky"]{--p:#3e83bf;--bg1:#eef8ff;--bg2:#f4f3ff;--panel:#fcfeff}body[data-theme="sun"]{--p:#c98a20;--bg1:#fff9e8;--bg2:#fff2e7;--panel:#fffefa}.all-list{max-height:310px;overflow:auto}.all-list p{padding:9px 0;margin:0;border-bottom:1px solid var(--line)}.todo-board{min-height:180px}.todo-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.todo-column{border-radius:14px;padding:12px;background:#faf9fe}.todo-column h4{margin:0 0 9px;font-size:13px}.todo-column p{margin:7px 0;font-size:12px}@media(max-width:570px){.todo-summary{grid-template-columns:1fr}}@media(max-width:900px){.app{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.right{grid-template-columns:1fr 1fr}}@media(max-width:570px){.app{padding:10px}.side{position:static}.head{display:block}.right{display:block}.right .box{margin:10px 0}.day{height:65px;padding:4px}.task{display:none}.months{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="box side"><div class="brand"><i>☀</i> 晴日计划本</div><p class="muted">把生活过成值得期待的样子</p><div class="tabs" id="tabs"><button class="on" data-type="工作">💼 工作</button><button data-type="生活">🌷 生活</button><button data-type="健康">🍀 健康</button></div><div class="nav"><button class="round" id="prev">‹</button><b id="month"></b><button class="round" id="next">›</button></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="mini" id="mini"></div><div class="quick"><b>快捷记录</b><div id="quick"></div></div><div class="quick"><b>页面配色</b><div id="themes"><button class="theme-dot on" data-theme="violet" style="background:#8874d9"></button><button class="theme-dot" data-theme="coral" style="background:#df806a"></button><button class="theme-dot" data-theme="mint" style="background:#49a98d"></button><button class="theme-dot" data-theme="sky" style="background:#508ecb"></button><button class="theme-dot" data-theme="sun" style="background:#d59a32"></button></div></div></aside><main><div class="head"><div><h1 id="title">八月，工作顺利 ☀</h1><p class="muted" id="dateinfo"></p></div><div class="views"><button class="on">月</button><button>周</button><button>日</button></div></div><div class="layout"><section class="box"><div class="calhead"><button class="round">‹</button><b id="ct"></b><button class="round">›</button></div><div class="cal" id="cal"></div></section><div class="right"><section class="box"><h3>✨ 今日待办</h3><button class="chip" id="allTodos">查看全部待办</button><div id="todos"></div><div class="add"><input id="todo" placeholder="添加今天要做的事…"><button id="addtodo">＋</button></div></section><section class="box"><h3>🗓 周计划 · 月计划</h3><div class="plans"><div class="plan"><b>本周重点</b><br><span contenteditable>完成项目方案</span></div><div class="plan"><b>本月目标</b><br><span contenteditable>读完两本书</span></div></div></section><section class="box"><h3>💌 纪念与倒数</h3><div id="events"></div><button class="chip" id="addEvent">＋ 添加日期</button></section><section class="box fortune"><h3>🔮 今日运势</h3><p id="fortune">填写生日与生辰，获取专属建议。</p><p class="muted"><b>算法：</b><span id="algo">尚未设置</span></p><p class="muted" id="wear"></p><button class="chip" id="profile">设置个人信息</button></section><section class="box weather"><h3>⛅ 天气查询</h3><b id="place">等待定位</b><p class="muted" id="weather">点击定位以查询当地天气</p><button class="chip" id="locate">获取我的位置</button></section></div><section class="box future todo-board"><h3>📋 待办事项总览</h3><p class="muted">集中查看所有待办事项</p><div class="todo-summary"><div class="todo-column"><h4>💼 工作待办</h4><p>⬜ 项目复盘</p><p>⬜ 整理本周工作清单</p></div><div class="todo-column"><h4>🌷 生活待办</h4><p>⬜ 购物清单</p><p>⬜ 阅读 30 分钟</p></div><div class="todo-column"><h4>🍀 健康待办</h4><p>⬜ 舒缓运动</p><p>⬜ 记录今日体重</p></div></div><div id="months" style="display:none"></div></section></div></main></div><div class="modal" id="eventModal"><div class="box dialog"><h3>添加纪念日 / 倒数日</h3><select id="etype"><option value="ann">纪念日（每年提醒）</option><option value="count">倒数日（未来 / 过去）</option></select><input id="ename" placeholder="名称：生日、转正、入职"><input type="date" id="edate"><button class="save" id="saveEvent">保存</button></div></div><div class="modal" id="profileModal"><div class="box dialog"><h3>我的运势档案</h3><input id="pname" placeholder="昵称"><input type="date" id="birth"><select id="hour"><option value="">不填写时辰（使用星座算法）</option><option>子时（23:00-01:00）</option><option>丑时（01:00-03:00）</option><option>寅时（03:00-05:00）</option><option>卯时（05:00-07:00）</option><option>辰时（07:00-09:00）</option><option>巳时（09:00-11:00）</option><option>午时（11:00-13:00）</option><option>未时（13:00-15:00）</option><option>申时（15:00-17:00）</option><option>酉时（17:00-19:00）</option><option>戌时（19:00-21:00）</option><option>亥时（21:00-23:00）</option></select><button class="save" id="saveProfile">保存档案</button></div></div><div class="modal" id="allTodoModal"><div class="box dialog"><h3>全部待办事项</h3><div class="all-list" id="allTodoList"></div><button class="save" id="closeTodos">关闭</button></div></div><script>
const $=x=>document.querySelector(x),N=new Date(),S={y:N.getFullYear(),m:N.getMonth(),type:'工作',todos:JSON.parse(localStorage.todos||'[]'),events:JSON.parse(localStorage.events||'[]'),p:JSON.parse(localStorage.profile||'null'),shifts:JSON.parse(localStorage.shifts||'{}'),theme:localStorage.theme||'violet'},pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),terms={19:'立春',34:'雨水',49:'惊蛰',64:'春分',79:'清明',94:'谷雨',110:'立夏',125:'小满',140:'芒种',156:'夏至',172:'小暑',188:'大暑',204:'立秋',220:'处暑',236:'白露',251:'秋分',267:'寒露',282:'霜降',298:'立冬',313:'小雪',329:'大雪',344:'冬至'};function save(){localStorage.todos=JSON.stringify(S.todos);localStorage.events=JSON.stringify(S.events);localStorage.profile=JSON.stringify(S.p);localStorage.shifts=JSON.stringify(S.shifts);localStorage.theme=S.theme}function term(d){return terms[Math.floor((d-new Date(d.getFullYear(),0,1))/864e5)]||''}function cal(){let f=new Date(S.y,S.m,1),n=new Date(S.y,S.m+1,0).getDate(),a='',b=['日','一','二','三','四','五','六'].map(x=>'<div class=dow>周'+x+'</div>').join('');$('#month').textContent=$('#ct').textContent=S.y+'年'+(S.m+1)+'月';for(let i=0;i<f.getDay();i++){a+='<i></i>';b+='<i class=empty></i>'}for(let d=1;d<=n;d++){let x=new Date(S.y,S.m,d),z=S.shifts[key(x)]||'',c=key(x)==key(N)?'today ':'';if(S.events.some(e=>e.d.slice(5)==key(x).slice(5)))c+='event ';a+=`<span class="${c}">${d}</span>`;b+=`<div class="day ${c+z}" data-k="${key(x)}"><b>${d}</b><span class=term>${term(x)}</span><div class=lunar>${d==1?'初一':d==15?'十五':''}</div>${z?'<div class=shift>'+({morning:'🌅 早班',normal:'☀️ 正常班',overtime:'🌙 加班'}[z])+'</div>':''}${d==N.getDate()?'<div class=task>项目复盘</div>':''}</div>`}$('#mini').innerHTML=a;$('#cal').innerHTML=b}function render(){document.body.dataset.theme=S.theme;document.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('on',x.dataset.theme===S.theme));cal();$('#title').textContent='八月，'+(S.type==='工作'?'工作顺利 ☀':S.type==='生活'?'好好生活 🌷':'身体轻盈 🍀');$('#dateinfo').textContent=N.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' · '+(term(N)||'平安喜乐');document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.type===S.type));let q=S.type==='工作'?[['🌅 早班','morning'],['☀️ 正常班','normal'],['🌙 加班','overtime'],['↩ 清除班次','clearShift']]:S.type==='健康'?[['⚖️ 添加体重','health'],['🌸 生理期','health'],['🏃 运动记录','health']]:[['🛒 购物','life'],['🧹 家务','life'],['📚 阅读','life']];$('#quick').innerHTML=q.map(x=>`<button class=chip data-a="${x[1]}">${x[0]}</button>`).join('');$('#todos').innerHTML=S.todos.map((x,i)=>`<label class=todo><input type=checkbox data-i=${i} ${x.done?'checked':''}> ${x.text}</label>`).join('')||'<label class=todo><input type=checkbox> 整理本周工作清单</label>';let t=new Date(N.getFullYear(),N.getMonth(),N.getDate());$('#events').innerHTML=S.events.map(e=>{let d=new Date(e.d+'T00:00'),q;if(e.type==='ann'){q=new Date(N.getFullYear(),d.getMonth(),d.getDate());if(q<t)q.setFullYear(q.getFullYear()+1);return `<div class=eventrow>💝 <b>${e.name}</b><br>　今年距离这一天还有 ${Math.ceil((q-t)/864e5)} 天</div>`}q=Math.ceil((d-t)/864e5);return `<div class=eventrow>⏳ <b>${e.name}</b><br>　${q>=0?'距离 '+e.name+' 还剩 '+q+' 天':'您 '+e.name+' 已经 '+(-q)+' 天'}</div>`}).join('')||'<p class=muted>添加重要日子，让期待有迹可循</p>';$('#months').innerHTML=Array.from({length:8},(_,i)=>{let d=new Date(N.getFullYear(),N.getMonth()+i+1),p=(i*17)%80+15;return `<div class=month><b>${d.getFullYear()}年${d.getMonth()+1}月</b><br>计划进行中<div class=bar><i style="width:${p}%"></i></div></div>`}).join('');if(S.p){let bz=!!S.p.hour;$('#algo').textContent=bz?'八字五行简析（出生日期 + 时辰）':'星座（根据出生日期）';$('#fortune').textContent=(S.p.name||'你')+'，今天适合先完成一件最重要的小事。';$('#wear').textContent='适合穿戴：'+(bz?'浅绿色、暖杏色，搭配玉石饰品。':'雾紫色、奶油白，搭配简约银饰。')}}$('#tabs').onclick=e=>{if(e.target.dataset.type&&e.target.dataset.type!==S.type){S.type=e.target.dataset.type;render()}};$('#prev').onclick=()=>{S.m--;if(S.m<0){S.m=11;S.y--}cal()};$('#next').onclick=()=>{S.m++;if(S.m>11){S.m=0;S.y++}cal()};$('#quick').onclick=e=>{let a=e.target.dataset.a;if(['morning','normal','overtime'].includes(a)){S.shifts[key(N)]=a;save();cal()}else if(a==='clearShift'){delete S.shifts[key(N)];save();cal()}else if(a)alert('已添加 '+e.target.textContent+' 记录')};$('#cal').onclick=e=>{let d=e.target.closest('[data-k]');if(d&&S.type==='工作'){let x=d.dataset.k;S.shifts[x]=S.shifts[x]==='morning'?'normal':S.shifts[x]==='normal'?'overtime':S.shifts[x]==='overtime'?undefined:'morning';if(!S.shifts[x])delete S.shifts[x];save();cal()}};$('#addtodo').onclick=()=>{let x=$('#todo').value.trim();if(x){S.todos.push({text:x,done:false});$('#todo').value='';save();render()}};$('#todos').onchange=e=>{let i=e.target.dataset.i;if(S.todos[i]){S.todos[i].done=e.target.checked;save()}};$('#addEvent').onclick=()=>$('#eventModal').classList.add('open');$('#saveEvent').onclick=()=>{if($('#ename').value&&$('#edate').value){S.events.push({name:$('#ename').value,d:$('#edate').value,type:$('#etype').value});save();$('#eventModal').classList.remove('open');render()}};$('#profile').onclick=()=>$('#profileModal').classList.add('open');$('#saveProfile').onclick=()=>{if($('#birth').value){S.p={name:$('#pname').value,birth:$('#birth').value,hour:$('#hour').value};save();$('#profileModal').classList.remove('open');render()}};$('#locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$('#place').textContent='你的位置 · '+p.coords.latitude.toFixed(2)+'°, '+p.coords.longitude.toFixed(2);$('#weather').textContent='定位成功。接入天气 API 后显示实时温度与预报。'},()=>$('#weather').textContent='未取得定位权限，请允许浏览器访问位置。'):0;render();
</script></body></html>
